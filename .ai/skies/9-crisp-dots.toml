# every rate below is per second (v6b); a v6 file's numbers still load,
# but now mean 10x less per frame at the default 0.1s sampling
# 9-crisp-dots: puffs bloom with no haze at all and a dotted pile: hard edges
# a commented line shows the current default; uncomment and edit to pin it

[far]
# wind_scale = 0.25  # fraction of the world's wind this grid drifts at
# kx = 0.5  # horizontal diffusion per second — spreads mass along a streak
# ky = 0.03  # vertical diffusion per second — spreads mass across a streak (keep small)
# growth = 30.0  # logistic growth rate per second inside a band
# evaporation = 0.15  # decay rate per second everywhere, strongest outside a band
# nucleate_p = 0.5  # probability per second of a new puff
# puff_lo = 0.5  # a puff's minimum added density
# puff_hi = 0.8  # a puff's maximum added density
# puff_width = 30  # a puff's width in pixels
# puff_height = 2  # a puff's height in pixels
# band_sigma_lo = 1.5  # a band's minimum vertical spread in pixels
# band_sigma_hi = 2.5  # a band's maximum vertical spread in pixels
# band_count = 2  # how many bands this grid draws at startup
# uptake = 2.5  # moisture a unit of growth spends; higher means shorter-lived streaks
# replenish = 0.02  # moisture return rate per second toward 1
# floor = 0.03  # density below this snaps to zero, so evaporation leaves no haze
# allee = 0.15  # density a streak must reach to grow; below it, it thins away

[mid]
# wind_scale = 0.55  # fraction of the world's wind this grid drifts at
# kx = 0.5  # horizontal diffusion per second — spreads mass along a streak
# ky = 0.03  # vertical diffusion per second — spreads mass across a streak (keep small)
# growth = 30.0  # logistic growth rate per second inside a band
# evaporation = 0.15  # decay rate per second everywhere, strongest outside a band
# nucleate_p = 0.5  # probability per second of a new puff
# puff_lo = 0.5  # a puff's minimum added density
# puff_hi = 0.8  # a puff's maximum added density
# puff_width = 30  # a puff's width in pixels
# puff_height = 2  # a puff's height in pixels
# band_sigma_lo = 1.5  # a band's minimum vertical spread in pixels
# band_sigma_hi = 2.5  # a band's maximum vertical spread in pixels
# band_count = 2  # how many bands this grid draws at startup
# uptake = 2.5  # moisture a unit of growth spends; higher means shorter-lived streaks
# replenish = 0.02  # moisture return rate per second toward 1
# floor = 0.03  # density below this snaps to zero, so evaporation leaves no haze
# allee = 0.15  # density a streak must reach to grow; below it, it thins away

[near]
# wind_scale = 1.0  # fraction of the world's wind this grid drifts at
# kx = 0.5  # horizontal diffusion per second — spreads mass along a streak
# ky = 0.03  # vertical diffusion per second — spreads mass across a streak (keep small)
# growth = 30.0  # logistic growth rate per second inside a band
# evaporation = 0.15  # decay rate per second everywhere, strongest outside a band
# nucleate_p = 0.5  # probability per second of a new puff
# puff_lo = 0.5  # a puff's minimum added density
# puff_hi = 0.8  # a puff's maximum added density
# puff_width = 30  # a puff's width in pixels
# puff_height = 2  # a puff's height in pixels
# band_sigma_lo = 1.5  # a band's minimum vertical spread in pixels
# band_sigma_hi = 2.5  # a band's maximum vertical spread in pixels
# band_count = 2  # how many bands this grid draws at startup
# uptake = 2.5  # moisture a unit of growth spends; higher means shorter-lived streaks
# replenish = 0.02  # moisture return rate per second toward 1
# floor = 0.03  # density below this snaps to zero, so evaporation leaves no haze
# allee = 0.15  # density a streak must reach to grow; below it, it thins away

[shared]
pile_style = 'dots'  # landed-cactus rendering: 'blocks' (quadrant blocks) or 'dots' (splatted, dithered)
# stick_distance = 1.4  # how close two falling seeds' members must be, in sub-cells, to merge into one clump
# shear_floor = 0.3  # minimum drift speed per row, pixels/second, so drift never stalls
# shear_base = 6.999999999999999  # row shear's base fraction of a grid's own wind, per second
# shear_span = 2.9999999999999996  # row shear's extra fraction at the bottom of the sky, per second
# tone_exp = 0.45  # block-mean lift before the 16-step tone ramp
haze_depth_weight = 0.0  # how much a grid's fixed depth mixes toward haze
haze_row_weight = 0.0  # how much a cell's height mixes toward haze
# haze_clamp = 0.85  # ceiling on the haze mix, however deep or high
# blank_mean = 0.1  # block mean below this renders blank
core_mean = 0.7  # block mean at or above this renders a solid core
semi_core_mean = 0.55  # block mean at or above this alternates core/dither
# flat_gx = 0.15  # minimum x gradient for a flat cirrus stroke
# flat_gy_max = 0.1  # maximum y gradient allowed for a flat cirrus stroke
# flat_mean_lo = 0.25  # flat stroke's minimum block mean
# flat_mean_hi = 0.7  # flat stroke's maximum block mean
# edge_mean_hi = 0.65  # tapering edge strokes are only tried below this mean
# edge_gx = 0.15  # minimum x gradient for a tapering edge stroke
# edge_gy = 0.1  # minimum y gradient for a tapering edge stroke
# horizon = 0.36  # the horizon line, as a fraction of sky height down from the top
# focal = 24.0  # perspective focal length in pixels — z(r) = focal / (r - horizon_px)
# z_far = 32.0  # world distance a grid's far edge (and the haze mix) clamps to
# ground_lines = 7  # how many faint perspective lines cross the ground band (0 disables)
# deck_altitude_px = 0.0  # the deck's world y — how far above the horizon its top peeks through
# fps = 5  # how often the TUI samples and redraws the field, per second
sky_engine = 'puffs'  # which sky renderer runs: 'fluid' (cellular automaton), 'texture' (cheaper baked noise), or 'puffs' (individual clouds, no whole-sky scroll)
cloud_style = 'bloom'  # puffs engine look: 'drift' (each cloud wanders its own way), 'bloom' (near-still clouds unfold and recede), 'streaks' (long thin bands)
# cloud_count = 1.0  # puffs engine population scale: 1.0 is one cloud per band per ~40 columns
cloud_drift = 0.3  # puffs engine top drift speed, pixels per second, before a band's own wind_scale; each cloud picks its own direction
# cloud_life = 90.0  # puffs engine seconds a cloud lives, unfold to recede
