[project]
name = "cactus"
version = "0.2.0"
description = "Durable question inbox between coding agents and a human"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "eighteyes" }]
requires-python = ">=3.11"
dependencies = ["textual>=0.80", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/eighteyes/cactus"
Repository = "https://github.com/eighteyes/cactus"

[project.scripts]
cactus = "cactus.cli:main"
cac = "cactus.cli:main"
cactus-mcp = "cactus.mcp:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["slow: a real-time probe (wall-clock, machine-dependent); deselect with -m 'not slow'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cactus"]
