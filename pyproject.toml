[project]
name = "cactus"
version = "0.1.0"
description = "Transitory question/answer interface between coding agents and a human"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
cactus = "cactus.cli:main"
cac = "cactus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cactus"]
