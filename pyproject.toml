[project]
name = "cactus"
version = "0.1.0"
description = "Durable question inbox between coding agents and a human"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "eighteyes" }]
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.urls]
Homepage = "https://github.com/eighteyes/cactus"
Repository = "https://github.com/eighteyes/cactus"

[project.scripts]
cactus = "cactus.cli:main"
cac = "cactus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cactus"]
